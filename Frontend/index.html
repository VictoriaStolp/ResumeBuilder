<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkingGirlie-ResumeBuilder</title>
    <link href="css/lib/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/lib/bootswatch.min.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-md-5" id="divHomePage" style="font-size: x-large">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">WorkingGirlie-ResumeBuilder</h2>
                <form>   
                    <button id="btnAdd" class="btn btn-primary col-12 mt-2" type="button">Add Resume Information</button>
                    <button id="btnPrintResume" class="btn btn-secondary col-12 mt-2" type="button">Print Resume</button>
                </form>
            </div>
        </div>

        <div class="card col-8" style="display:none" id="divAddResumeInfo">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Resume Info-Options</h2>
                <button id="btnJobs" class="btn btn-secondary col-12 mt-2" type="button">Add Jobs</button>
                <button id="btnEducation" class="btn btn-secondary col-12 mt-2" type="button">Add Education</button>
                <button id="btnInvolvement" class="btn btn-secondary col-12 mt-2" type="button">Add Involvement</button>
                <button id="btnSkill" class="btn btn-secondary col-12 mt-2" type="button">Add Skill</button>
                <button id="btnCertification" class="btn btn-secondary col-12 mt-2" type="button">Add Certification</button>
                <button id="btnAward" class="btn btn-secondary col-12 mt-2" type="button">Add Award</button>
                <button id="btnBack" class="btn btn-info col-12 mt-2" type="button">Back to HomePage</button> 
            </div>
        </div>

        <div class="card col-11 col-md-5" id="divAddJobInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Job Information</h2>
                <form>   
                    <label class="form-label" for="txtCompanyName">Company Name</label>
                    <input class="form-control" id="txtCompanyName" type="text">
                    <label class="form-label" for="txtPositionName">Position Name</label>
                    <input class="form-control" id="txtPositionName" type="text">   
                    <label class="form-label" for="txtLocation">Location</label>
                    <input class="form-control" id="txtLocation" type="text">  
                    <label class="form-label" for="txtStartDate">Start Date</label>
                    <input class="form-control" id="txtStartDate" type="text">
                    <label class="form-label" for="txtEndDate">End Date</label>
                    <input class="form-control" id="txtEndDate" type="text">     
                    <hr />
                    <button id="btnSubmitJob" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo1" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>

        <div class="card col-11 col-md-5" id="divAddEduInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Education Information</h2>
                <form>   
                    <label class="form-label" for="txtCollegeName">College Name</label>
                    <input class="form-control" id="txtCollegeName" type="text">
                    <label class="form-label" for="txtMajor">Major</label>
                    <input class="form-control" id="txtMajor" type="text">   
                    <label class="form-label" for="txtConcentration">Concentration</label>
                    <input class="form-control" id="txtConcentration" type="text">  
                    <label class="form-label" for="txtGraduationDate">Graduation Date</label>
                    <input class="form-control" id="txtGraduationDate" type="text">
                    <label class="form-label" for="txtLocation">Location</label>
                    <input class="form-control" id="txtLocation" type="text">     
                    <hr />
                    <button id="btnSubmitEdu" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo2" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>

        <div class="card col-11 col-md-5" id="divAddInvInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Involvement Information</h2>
                <form>   
                    <label class="form-label" for="txtOrgName">Organization Name</label>
                    <input class="form-control" id="txtOrgName" type="text">
                    <label class="form-label" for="txtPositionName">Position Name</label>
                    <input class="form-control" id="txtPositionName" type="text">   
                    <label class="form-label" for="txtLocation">Location</label>
                    <input class="form-control" id="txtLocation" type="text">  
                    <label class="form-label" for="txtStartDate">Start Date</label>
                    <input class="form-control" id="txtStartDate" type="text">
                    <label class="form-label" for="txtEndDate">End Date</label>
                    <input class="form-control" id="txtEndDate" type="text">     
                    <hr />
                    <button id="btnSubmitInv" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo3" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>

        <div class="card col-11 col-md-5" id="divAddSkillInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Skill Information</h2>
                <form>   
                    <label class="form-label" for="txtSkillName">Skill Name</label>
                    <input class="form-control" id="txtSkillName" type="text">
                    <label class="form-label" for="txtCategoryName">Category Name</label>
                    <input class="form-control" id="txtCategoryName" type="text">       
                    <hr />
                    <button id="btnSubmitSkill" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo4" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>
        
        <div class="card col-11 col-md-5" id="divAddCertInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Certification Information</h2>
                <form>   
                    <label class="form-label" for="txtCertOrgName">Certificate Organization Name</label>
                    <input class="form-control" id="txtCertOrgName" type="text">
                    <label class="form-label" for="txtCertificationName">Certification Name</label>
                    <input class="form-control" id="txtCertificationName" type="text">       
                    <hr />
                    <button id="btnSubmitCert" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo5" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>

        <div class="card col-11 col-md-5" id="divAddAwardInfo" style="display:none">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Award Information</h2>
                <form>   
                    <label class="form-label" for="txtAwardName">Award Name</label>
                    <input class="form-control" id="txtAwardName" type="text">
                    <label class="form-label" for="txtAwardingOrgName">Awarding Organization Name</label>
                    <input class="form-control" id="txtAwardingOrgName" type="text">
                    <label class="form-label" for="txtDescription">Description</label>
                    <input class="form-control" id="txtDescription" type="text">   
                    <label class="form-label" for="txtDateAwarded">Date Awarded</label>
                    <input class="form-control" id="txtDateAwarded" type="text">        
                    <hr />
                    <button id="btnSubmitAward" class="btn btn-primary col-12 mt-2" type="button">Submit</button>
                    <button id="btnBackToResumeInfo6" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
                </form>
            </div>
        </div>

        
    </div>
    <script src="js/lib/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/lib/sweetalert2@11.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
