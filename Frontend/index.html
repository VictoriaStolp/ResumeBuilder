<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkingGirlie-ResumeBuilder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/lib/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-md-5" id="divMine" style="font-size: x-large">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">WorkingGirlie-ResumeBuilder</h2>
                <form>   
                    <label class="form-label" for="txtTransAmt">Transacton Amount</label>
                    <input class="form-control" id="txtTransAmt" type="text">
                    <label class="form-label" for="txtTransRecipient">Transaction Recipient</label>
                    <input class="form-control" id="txtTransRecipient" type="text">
                    <hr />
                    <button id="btnMine" class="btn btn-primary col-12 mt-2" type="button">Mine</button>
                    <button id="btnPrintChain" class="btn btn-secondary col-12 mt-2" type="button">Print Chain</button>
                </form>
            </div>
        </div>

        <div class="card col-8" style="display:none" id="divPrintChain">
            <div class="card-body">
                <h2 class="text-center mb-4">Print Chain</h2>
                <button id="btnPrint" class="btn btn-primary col-12 mt-2" type="button">Print</button>
                <button id="btnContinueMining" class="btn btn-secondary col-12 mt-2" type="button">Continue Mining</button>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/lib/sweetalert2@11.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
