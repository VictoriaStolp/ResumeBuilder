<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkingGirlie-ResumeBuilder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/lib/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-md-5" id="divHomePage" style="font-size: x-large">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">WorkingGirlie-ResumeBuilder</h2>
                <form>   
                    <button id="btnAdd" class="btn btn-primary col-12 mt-2" type="button">Add Resume Information</button>
                    <button id="btnPrintResume" class="btn btn-secondary col-12 mt-2" type="button">Print Resume</button>
                </form>
            </div>
        </div>

        <div class="card col-8" style="display:none" id="divAddResumeInfo">
            <div class="card-body">
                <div class="d-flex justify-content-center">
                <img src="images/WorkingGirlie-Logo.png" alt="WorkingGirlie Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Add Resume Info-Options</h2>
                <button id="btnJobs" class="btn btn-secondary col-12 mt-2" type="button">Add Jobs</button>
                <button id="btnEducation" class="btn btn-secondary col-12 mt-2" type="button">Add Education</button>
                <button id="btnInvolvement" class="btn btn-secondary col-12 mt-2" type="button">Add Involvement</button>
                <button id="btnSkill" class="btn btn-secondary col-12 mt-2" type="button">Add Skill</button>
                <button id="btnCertification" class="btn btn-secondary col-12 mt-2" type="button">Add Certification</button>
                <button id="btnAward" class="btn btn-secondary col-12 mt-2" type="button">Add Award</button>
                <button id="btnBack" class="btn btn-info col-12 mt-2" type="button">Back to HomePage</button>
                
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/lib/sweetalert2@11.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
